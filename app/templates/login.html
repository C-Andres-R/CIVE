<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CIVE Medical Pets - Login">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Inicia sesión - CIVE Medical Pets</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="login-container">
        <div class="login-left">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='images/logo-cive.png') }}" alt="CIVE Medical Pets Ecatepec">
            </div>
        </div>

        <div class="login-right">
            <div class="login-header">
                <h1 class="login-title">Inicia sesión</h1>
            </div>

            <form class="login-form" method="POST" action="{{ url_for('pages.procesar_inicio_sesion')}}" novalidate>
                <input type="hidden" name="next" value="{{ datos_formulario.next or '' }}">
                <div class="form-group">
                    <label class="form-label" for="email">email</label>
                    <div class="form-input-wrapper">
                        <input type="email" id="email" name="correo" class="form-input" value="{{ datos_formulario.correo }}">
                    </div>
                    <small class="field-error" data-field-error="correo">{{ errores_campo.correo or "" }}</small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="form-input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="contrasena"
                            class="form-input"
                        >
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <small class="field-error" data-field-error="contrasena">{{ errores_campo.contrasena or "" }}</small>
                </div>

                <div class="form-footer">
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="login-button">Iniciar sesión</button>
            </form>

            <div class="separator"></div>

            <div class="signup-text">
                ¿Aún no tienes una cuenta? <a href="#">Regístrate aquí.</a>
            </div>
        </div>
    </div>

    <script>
        window.getCsrfToken = () => {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.content : '';
        };

        window.injectCsrfTokens = (root = document) => {
            const token = window.getCsrfToken();
            if (!token) return;
            root.querySelectorAll('form').forEach((formNode) => {
                // Función para method.
                const method = (formNode.getAttribute('method') || 'get').toLowerCase();
                if (method !== 'post') return;
                let input = formNode.querySelector('input[name="_csrf_token"]');
                if (!input) {
                    input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = '_csrf_token';
                    formNode.prepend(input);
                }
                input.value = token;
            });
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.injectCsrfTokens();
        });

        // Permite mostrar u ocultar la contraseña escrita por el usuario.
        const form = document.querySelector('.login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const errorEls = {
            correo: document.querySelector('[data-field-error="correo"]'),
            contrasena: document.querySelector('[data-field-error="contrasena"]'),
        };
        let submitAttempted = {{ "true" if errores_campo else "false" }};

        // Función para set error.
        const setError = (field, message) => {
            const el = errorEls[field];
            if (el) el.textContent = submitAttempted ? (message || '') : '';
        };

        // Función para validate email.
        const validateEmail = () => {
            // Función para value.
            const value = (emailInput.value || '').trim();
            if (!value) {
                setError('correo', 'Este campo no puede estar vacío.');
                return false;
            }
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) {
                setError('correo', 'Por favor, verifica la información ingresada.');
                return false;
            }
            setError('correo', '');
            return true;
        };

        // Función para validate password.
        const validatePassword = () => {
            const value = passwordInput.value || '';
            if (!value) {
                setError('contrasena', 'Este campo no puede estar vacío.');
                return false;
            }
            setError('contrasena', '');
            return true;
        };

        // Función para validate form.
        const validateForm = () => [validateEmail(), validatePassword()].every(Boolean);

        passwordToggle.addEventListener('click', (e) => {
            // Alterna entre texto visible y contrasena oculta.
            e.preventDefault();
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        emailInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);
        form.addEventListener('submit', (e) => {
            submitAttempted = true;
            if (!validateForm()) {
                e.preventDefault();
            }
        });

    </script>
</body>

</html>
